name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
      - run: cargo test --release --locked

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, cpu: x86-64-v2, suffix: linux-x86-64-v2 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, cpu: x86-64-v3, suffix: linux-x86-64-v3 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, cpu: x86-64-v4, suffix: linux-x86-64-v4 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   cpu: x86-64-v2, suffix: windows-x86-64-v2, ext: .exe, flags: -C target-feature=+crt-static, test: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   cpu: x86-64-v3, suffix: windows-x86-64-v3, ext: .exe, flags: -C target-feature=+crt-static }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   cpu: x86-64-v4, suffix: windows-x86-64-v4, ext: .exe, flags: -C target-feature=+crt-static }
          - { os: macos-latest,   target: aarch64-apple-darwin,     cpu: apple-m1,  suffix: macos-arm64, test: true }
          - { os: ubuntu-latest,  target: aarch64-linux-android,    cpu: generic,   suffix: android-arm64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, cpu: generic, suffix: linux-arm64, test: true }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }} ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}
      - name: Use the Android NDK linker
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
      - name: Test on the build target
        if: matrix.test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/arabica${{ matrix.ext }}" \
             "dist/arabica-${GITHUB_REF_NAME}-${{ matrix.suffix }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: arabica-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
